# Host ports 180xx so this can run next to the project's kind cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # Argo CD UI/API
        hostPort: 18080
        listenAddress: 127.0.0.1
      - containerPort: 30081 # hello (exercises 1-4, 7)
        hostPort: 18081
        listenAddress: 127.0.0.1
      - containerPort: 30082 # web (exercise 10, CI/CD)
        hostPort: 18082
        listenAddress: 127.0.0.1
      - containerPort: 30083 # podinfo via Helm (exercise 5)
        hostPort: 18083
        listenAddress: 127.0.0.1
