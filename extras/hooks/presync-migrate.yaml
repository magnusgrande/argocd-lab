# Exercise 7. Runs before every sync of the app it's placed in; sync waits for it.
# A failing hook stops the sync -> nothing after it is applied.
apiVersion: batch/v1
kind: Job
metadata:
  name: presync-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.37
          command: ["sh", "-c", "echo 'pretend DB migration'; sleep 10; echo done"]
          # Try: replace with "exit 1" and sync again.
