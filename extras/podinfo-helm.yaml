# Exercise 5. A Helm chart straight from a chart repo, values inline.
# Argo CD runs `helm template` and applies the result - there is no Helm release
# (`helm list -A` shows nothing). Compare with helm_release / Helmfile.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo-helm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://stefanprodan.github.io/podinfo
    chart: podinfo
    targetRevision: 6.15.0
    helm:
      valuesObject:
        replicaCount: 2
        ui:
          message: "Rendered from a Helm chart"
          color: "#7c3457"
        service:
          type: NodePort
          nodePort: 30083 # -> http://localhost:18083
  destination:
    server: https://kubernetes.default.svc
    namespace: lab-podinfo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
